<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeckLens Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/dashboard.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/">DeckLens</a>
      <a href="/demo/slides.html">Demo Deck</a>
    </header>
    <main class="page">
      <section class="intro">
        <p class="eyebrow">Analytics</p>
        <h1>행동 분석 대시보드</h1>
        <p>페이지와 섹션 체류, 클릭, hover, 입력, 제출 이벤트를 로컬 collector에서 바로 확인합니다.</p>
        <div class="actions">
          <a class="button secondary" href="/demo/slides.html">데모 열기</a>
          <button class="secondary" id="clear-data" type="button">로컬 데이터 초기화</button>
        </div>
      </section>
      <section class="metrics" id="metrics"></section>
      <section>
        <h2>Page Dwell</h2>
        <div id="pages" class="table"></div>
      </section>
      <section>
        <h2>Section Heatmap</h2>
        <div id="sections" class="heatmap"></div>
      </section>
      <section>
        <h2>Actions</h2>
        <div id="actions" class="table"></div>
      </section>
      <section>
        <h2>Session Paths</h2>
        <div id="paths" class="paths"></div>
      </section>
    </main>
  </body>
</html>
