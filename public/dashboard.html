<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeckLens Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/i18n.js"></script>
    <script defer src="/dashboard.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/">DeckLens</a>
      <a data-i18n="nav.demo" href="/demo/slides.html">Demo Deck</a>
      <a data-lang-toggle href="?lang=ko">한국어</a>
    </header>
    <main class="page">
      <section class="intro">
        <p class="eyebrow">Analytics</p>
        <h1 data-i18n="dashboard.title">Behavior analytics dashboard</h1>
        <p data-i18n="dashboard.body">Review page dwell, section dwell, clicks, hover, input, and submit events from the local collector.</p>
        <div class="actions">
          <a class="button secondary" data-i18n="dashboard.openDemo" href="/demo/slides.html">Open demo</a>
          <button class="secondary" data-i18n="dashboard.clear" id="clear-data" type="button">Clear local data</button>
        </div>
      </section>
      <section class="metrics" id="metrics"></section>
      <section>
        <h2>Page Dwell</h2>
        <div id="pages" class="table"></div>
      </section>
      <section>
        <h2>Section Heatmap</h2>
        <div id="sections" class="heatmap"></div>
      </section>
      <section>
        <h2>Actions</h2>
        <div id="actions" class="table"></div>
      </section>
      <section>
        <h2>Session Paths</h2>
        <div id="paths" class="paths"></div>
      </section>
    </main>
  </body>
</html>
